name: Update live news

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect headlines from Indian news feeds
        run: node scripts/collect-news.mjs
      - name: Save the new headlines (Netlify redeploys automatically)
        run: |
          git config user.name "red-thread-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/
          git diff --cached --quiet || (git commit -m "Update live news" && git push)
